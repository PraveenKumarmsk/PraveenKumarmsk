<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="90" viewBox="0 0 1200 90" role="img" aria-label="Built with passion for Networking and Technology">
  <defs>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22e4ff" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#22e4ff"/>
      <stop offset="0.6" stop-color="#7c5cff"/>
      <stop offset="0.85" stop-color="#ff5cc8"/>
      <stop offset="1" stop-color="#ff5cc8" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="40" y="34" width="1120" height="2" rx="1" fill="url(#ac)"/>
  <circle r="4" cy="35" fill="#3dffa2" filter="url(#glow)">
    <animate attributeName="cx" values="40;1160" dur="5s" repeatCount="indefinite"/>
  </circle>
  <text x="600" y="68" text-anchor="middle" font-family="Consolas,'Courier New',monospace" font-size="15" fill="#8ea2cc" letter-spacing="1">Built with passion for Networking &amp; Technology  ·  © 2026 Praveen Kumar</text>
</svg>
