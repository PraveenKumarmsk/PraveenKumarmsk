<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Praveen Kumar - CCNA Certified Networking and IT Support">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060a14"/>
      <stop offset="0.55" stop-color="#0c1530"/>
      <stop offset="1" stop-color="#150f33"/>
    </linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22e4ff"/>
      <stop offset="0.6" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#ff5cc8"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#7aa2ff" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22e4ff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#22e4ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="320" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="22" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="318" rx="21" fill="none" stroke="#22e4ff" stroke-opacity="0.25"/>
  <circle cx="925" cy="160" r="170" fill="url(#halo)"/>

  <!-- status tag -->
  <g font-family="Consolas,'Courier New',monospace" font-size="14">
    <circle cx="78" cy="62" r="5" fill="#3dffa2" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="94" y="67" fill="#3dffa2" letter-spacing="1.5">STATUS: OPEN TO OPPORTUNITIES</text>
  </g>

  <!-- name + subtitle -->
  <text x="70" y="140" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="60" font-weight="700" fill="url(#ac)" letter-spacing="-1">Praveen Kumar</text>
  <text x="72" y="182" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="22" fill="#a9bbe0">CCNA Certified · Networking &amp; IT Support</text>

  <!-- terminal pill -->
  <rect x="70" y="212" width="600" height="46" rx="12" fill="#0a1224" fill-opacity="0.9" stroke="#22e4ff" stroke-opacity="0.35"/>
  <circle cx="90" cy="235" r="4.5" fill="#ff5f57"/>
  <circle cx="106" cy="235" r="4.5" fill="#febc2e"/>
  <circle cx="122" cy="235" r="4.5" fill="#28c840"/>
  <g font-family="Consolas,'Courier New',monospace" font-size="16">
    <text x="142" y="241" fill="#22e4ff">Praveen#</text>
    <text x="226" y="241" fill="#d5e2ff" opacity="0">show version   → CCNA Certified
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.23;0.25;1" dur="12s" begin="0s" repeatCount="indefinite"/>
    </text>
    <text x="226" y="241" fill="#d5e2ff" opacity="0">show skills    → VLAN · OSPF · NAT · DHCP
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.23;0.25;1" dur="12s" begin="3s" repeatCount="indefinite"/>
    </text>
    <text x="226" y="241" fill="#d5e2ff" opacity="0">show exp       → 3.2 yrs · 6,000+ students
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.23;0.25;1" dur="12s" begin="6s" repeatCount="indefinite"/>
    </text>
    <text x="226" y="241" fill="#d5e2ff" opacity="0">show status    → Open to NOC &amp; IT roles
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.23;0.25;1" dur="12s" begin="9s" repeatCount="indefinite"/>
    </text>
    <rect x="640" y="227" width="9" height="18" fill="#22e4ff">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- topology -->
  <g stroke="#22e4ff" stroke-opacity="0.4" stroke-width="1.5" fill="none">
    <path d="M925 160 L770 80"/>
    <path d="M925 160 L1070 70"/>
    <path d="M925 160 L1130 175"/>
    <path d="M925 160 L1040 265"/>
    <path d="M925 160 L800 255"/>
    <path d="M925 160 L735 165"/>
    <path d="M770 80 L735 165" stroke-opacity="0.2"/>
    <path d="M1070 70 L1130 175" stroke-opacity="0.2"/>
    <path d="M800 255 L1040 265" stroke-opacity="0.2"/>
  </g>
  <g fill="#0a1224" stroke="#22e4ff" stroke-width="2">
    <circle cx="770" cy="80" r="9"/>
    <circle cx="1070" cy="70" r="9"/>
    <circle cx="1130" cy="175" r="9"/>
    <circle cx="1040" cy="265" r="9"/>
    <circle cx="800" cy="255" r="9"/>
    <circle cx="735" cy="165" r="9"/>
  </g>
  <circle cx="925" cy="160" r="20" fill="#0a1224" stroke="url(#ac)" stroke-width="3" filter="url(#glow)"/>
  <circle cx="925" cy="160" r="20" fill="none" stroke="#7c5cff" stroke-opacity="0.6">
    <animate attributeName="r" values="20;42" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <g stroke="#22e4ff" stroke-width="2" stroke-linecap="round" fill="none">
    <path d="M916 156H934M930 151l5 5-5 5"/>
    <path d="M934 166H916M920 161l-5 5 5 5"/>
  </g>

  <!-- packets -->
  <g fill="#3dffa2" filter="url(#glow)">
    <circle r="3.5"><animateMotion dur="2.6s" repeatCount="indefinite" path="M925 160 L770 80"/></circle>
    <circle r="3.5"><animateMotion dur="3.1s" begin="0.6s" repeatCount="indefinite" path="M1070 70 L925 160"/></circle>
    <circle r="3.5"><animateMotion dur="2.8s" begin="1.1s" repeatCount="indefinite" path="M925 160 L1130 175"/></circle>
    <circle r="3.5"><animateMotion dur="3.3s" begin="0.3s" repeatCount="indefinite" path="M1040 265 L925 160"/></circle>
    <circle r="3.5"><animateMotion dur="2.4s" begin="1.6s" repeatCount="indefinite" path="M925 160 L800 255"/></circle>
    <circle r="3.5"><animateMotion dur="3s" begin="0.9s" repeatCount="indefinite" path="M735 165 L925 160"/></circle>
  </g>

  <g font-family="Consolas,'Courier New',monospace" font-size="12" fill="#7f93bd">
    <text x="780" y="100">SW1</text>
    <text x="1082" y="62">R2</text>
    <text x="1096" y="205">PC</text>
    <text x="1052" y="285">SRV</text>
    <text x="772" y="280">AP</text>
    <text x="696" y="192">FW</text>
    <text x="900" y="205" fill="#22e4ff">CORE</text>
  </g>
</svg>
